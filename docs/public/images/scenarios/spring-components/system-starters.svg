<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
  <title id="title">系统里的 Spring Boot 与 Spring Cloud starter 依赖</title>
  <desc id="desc">按截图整理的系统 starter 依赖，包括 banksteel 内部 starter、Spring Boot starter 和 Spring Cloud starter。</desc>
  <defs>
    <style>
      .bg { fill: #202327; }
      .panel { fill: #2b2f34; stroke: #444a52; stroke-width: 2; }
      .box { fill: transparent; stroke: #ff2d2d; stroke-width: 4; }
      .title { fill: #f2f5f8; font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtle { fill: #aeb6c2; font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .item-key { fill: #eef1f5; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .item-version { fill: #d0d5dc; font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #ff5a5a; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="900" rx="10"/>

  <rect class="panel" x="18" y="18" width="1244" height="90" rx="10"/>
  <text class="title" x="46" y="61">Dependency Analyzer：starter</text>
  <text class="subtle" x="46" y="91">把依赖按能力域记住：内部封装、Boot 单体能力、Cloud 服务治理。</text>

  <text class="label" x="32" y="145">内部与基础组件</text>
  <text class="item-key" x="32" y="184">banksteel-starter-dubbo</text><text class="item-version" x="360" y="184">: 1.0.0-20250212.003311-15</text>
  <text class="item-key" x="32" y="225">banksteel-starter-web</text><text class="item-version" x="336" y="225">: 1.0.0-20250212.003311-15</text>
  <text class="item-key" x="32" y="266">dubbo-spring-boot-starter</text><text class="item-version" x="392" y="266">: 3.2.16</text>
  <text class="item-key" x="32" y="307">dynamic-datasource-spring-boot-starter</text><text class="item-version" x="578" y="307">: 3.5.2</text>
  <text class="item-key" x="32" y="348">mybatis-plus-boot-starter</text><text class="item-version" x="392" y="348">: 3.4.3.3</text>

  <rect class="box" x="18" y="372" width="570" height="520"/>
  <text class="label" x="32" y="402">Spring Boot starter：应用内能力</text>
  <text class="item-key" x="32" y="442">spring-boot-starter</text><text class="item-version" x="316" y="442">: 2.5.2</text>
  <text class="item-key" x="32" y="482">spring-boot-starter-actuator</text><text class="item-version" x="438" y="482">: 2.5.2</text>
  <text class="item-key" x="32" y="522">spring-boot-starter-amqp</text><text class="item-version" x="402" y="522">: 2.5.2</text>
  <text class="item-key" x="32" y="562">spring-boot-starter-aop</text><text class="item-version" x="366" y="562">: 2.5.2</text>
  <text class="item-key" x="32" y="602">spring-boot-starter-cache</text><text class="item-version" x="396" y="602">: 2.5.2</text>
  <text class="item-key" x="32" y="642">spring-boot-starter-jdbc</text><text class="item-version" x="374" y="642">: 2.5.2</text>
  <text class="item-key" x="32" y="682">spring-boot-starter-json</text><text class="item-version" x="368" y="682">: 2.5.2</text>
  <text class="item-key" x="32" y="722">spring-boot-starter-logging</text><text class="item-version" x="424" y="722">: 2.5.2</text>
  <text class="item-key" x="32" y="762">spring-boot-starter-test</text><text class="item-version" x="366" y="762">: 2.5.2</text>
  <text class="item-key" x="32" y="802">spring-boot-starter-tomcat</text><text class="item-version" x="400" y="802">: 2.5.2</text>
  <text class="item-key" x="32" y="842">spring-boot-starter-validation</text><text class="item-version" x="448" y="842">: 2.5.2</text>
  <text class="item-key" x="32" y="882">spring-boot-starter-web</text><text class="item-version" x="366" y="882">: 2.5.2</text>

  <rect class="box" x="626" y="372" width="620" height="520"/>
  <text class="label" x="640" y="402">Spring Cloud starter：服务治理能力</text>
  <text class="item-key" x="640" y="442">spring-cloud-starter</text><text class="item-version" x="934" y="442">: 3.0.3</text>
  <text class="item-key" x="640" y="482">spring-cloud-starter-circuitbreaker-resilience4j</text><text class="item-version" x="1160" y="482">: 2.0.2</text>
  <text class="item-key" x="640" y="522">spring-cloud-starter-consul</text><text class="item-version" x="1010" y="522">: 3.0.3</text>
  <text class="item-key" x="640" y="562">spring-cloud-starter-consul-config</text><text class="item-version" x="1108" y="562">: 3.0.3</text>
  <text class="item-key" x="640" y="602">spring-cloud-starter-consul-discovery</text><text class="item-version" x="1140" y="602">: 3.0.3</text>
  <text class="item-key" x="640" y="642">spring-cloud-starter-loadbalancer</text><text class="item-version" x="1090" y="642">: 3.0.3</text>
  <text class="item-key" x="640" y="682">spring-cloud-starter-openfeign</text><text class="item-version" x="1070" y="682">: 3.0.3</text>

  <text class="label" x="32" y="948">记忆顺序</text>
  <text class="subtle" x="32" y="982">Boot：入口 Web/Tomcat → 数据 JDBC/MyBatis → 横切 AOP/事务 → 缓存/消息 → JSON/日志/监控/测试。</text>
  <text class="subtle" x="32" y="1014">Cloud：注册发现 Consul → 配置 Consul Config → 调用 OpenFeign → 负载 LoadBalancer → 容错 Resilience4j。</text>
</svg>
